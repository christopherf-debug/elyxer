[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eLyXer"
version = "1.2.5"
description = "LyX to HTML converter"
readme = "README.md"
requires-python = ">=3.6"
license = "GPL-3.0-or-later"
authors = [
    {name = "Alex Fernandez", email = "elyxer@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "http://elyxer.nongnu.org/"

[project.scripts]
elyxer = "elyxer.main.convert:main"
